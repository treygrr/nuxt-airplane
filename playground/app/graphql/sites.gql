fragment SiteFields on Site {
  id
  name
  archived
  items {
    id
    name
    onHand
  }
}

query GetSites($archived: Boolean, $search: String) {
  sites(archived: $archived, search: $search) {
    ...SiteFields
  }
}

query GetItems {
  items {
    id
    name
  }
}

query ItemsPage($query: String, $page: Int, $pageSize: Int) {
  itemsPage(query: $query, page: $page, pageSize: $pageSize) {
    page
    pageSize
    totalCount
    totalPages
    items {
      id
      name
    }
  }
}

query SearchItems($query: String, $first: Int, $after: String) {
  searchItems(query: $query, first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
      }
    }
  }
}

mutation CreateSite($name: String!) {
  createSite(name: $name) {
    ...SiteFields
  }
}

mutation ArchiveSite($id: ID!) {
  archiveSite(id: $id) {
    ...SiteFields
  }
}

mutation UnarchiveSite($id: ID!) {
  unarchiveSite(id: $id) {
    ...SiteFields
  }
}

mutation RenameSite($id: ID!, $name: String!) {
  renameSite(id: $id, name: $name) {
    ...SiteFields
  }
}

mutation DeleteSite($id: ID!) {
  deleteSite(id: $id)
}

mutation AddSiteItem($siteId: ID!, $itemId: ID!, $onHand: Int) {
  addSiteItem(siteId: $siteId, itemId: $itemId, onHand: $onHand) {
    ...SiteFields
  }
}

mutation RemoveSiteItem($siteId: ID!, $itemId: ID!) {
  removeSiteItem(siteId: $siteId, itemId: $itemId) {
    ...SiteFields
  }
}

mutation UpdateSiteItemOnHand($siteId: ID!, $itemId: ID!, $onHand: Int!) {
  updateSiteItemOnHand(siteId: $siteId, itemId: $itemId, onHand: $onHand) {
    id
    name
    onHand
  }
}
