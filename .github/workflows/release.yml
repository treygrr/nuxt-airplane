name: release

# Publishes the package to npm when a GitHub release is published.
#
# No npm token is stored here: npm's trusted publishing lets this workflow
# publish by its identity (OIDC). It has to be allowed once on npmjs.com:
#   package @treygrr/nuxt-airplane → Settings → Trusted Publisher →
#   GitHub Actions, repository treygrr/nuxt-airplane, workflow release.yml
#
# To release: bump `version` in package.json on main, then publish a GitHub
# release whose tag is `v` + that version. `workflow_dispatch` publishes an
# existing tag, for a release made before this workflow could publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, e.g. v0.7.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm verify this run: trusted publishing and provenance.
      id-token: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag is the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version on main before releasing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prepare
        run: npm run dev:prepare

      - name: Test
        run: npm run test

      # `prepack` builds the module. A prerelease (0.8.0-beta.1) goes out under `next`, not `latest`.
      - name: Publish
        run: |
          case "$TAG" in
            *-*) dist=next ;;
            *) dist=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist"
