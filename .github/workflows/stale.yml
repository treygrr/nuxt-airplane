# Matches the contributing guidelines: a PR with no activity for a month is
# marked stale and closed two weeks later unless someone picks it up.
name: stale

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has had no activity for 30 days and will be closed in
            two weeks unless it is updated. Comment or push to keep it open; it can
            always be reopened later.
          close-pr-message: >
            Closed for inactivity. Feel free to reopen when you pick it up again.
          # Issues are not auto-closed; only PRs.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          exempt-pr-labels: pinned,work-in-progress
