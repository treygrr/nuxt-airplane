name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the root .nuxt/tsconfig.json that the root tsconfig extends;
      # Vite resolves it for dependencies hoisted to the root node_modules.
      - name: Prepare module
        run: npm run dev:prepare

      - name: Build docs
        run: npx nuxt build docs --preset github_pages
        env:
          # Project page: served under https://treygrr.github.io/nuxt-airplane/
          NUXT_APP_BASE_URL: /nuxt-airplane/
          NUXT_SITE_URL: https://treygrr.github.io

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
